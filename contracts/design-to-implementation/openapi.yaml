openapi: 3.1.0
info:
  title: QuickBite Platform API
  version: 1.0.0
  description: "RESTful HTTPS API for the QuickBite food-delivery platform. Covers customer ordering, restaurant partner management, delivery agent workflows, and platform administration. Real-time updates are delivered via Socket.IO WebSocket connections on the same gateway host."
servers:
  - url: "https://api.quickbite.io/v1"
tags:
  - name: auth
    description: "Registration, login, token refresh, verification, and password reset"
  - name: users
    description: "User profile and saved-address management"
  - name: restaurants
    description: "Restaurant discovery, browsing, and partner settings"
  - name: menus
    description: "Menu category and menu-item management (restaurant managers)"
  - name: carts
    description: "Per-customer singleton cart operations"
  - name: orders
    description: "Order placement, status transitions, and history"
  - name: payments
    description: Payment records and refund operations
  - name: deliveries
    description: "Delivery assignment, agent workflow, and live location"
  - name: reviews
    description: Customer ratings and reviews on delivered orders
  - name: disputes
    description: Customer dispute submission and admin resolution
  - name: "platform-config"
    description: "Platform-wide configuration parameters (admin only)"
  - name: "audit-logs"
    description: Immutable administrative action log (admin only)
paths:
  "/auth/register":
    post:
      tags:
        - auth
      operationId: registerUser
      summary: Register a new user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RegisterRequest"
            example:
              firstName: Jane
              lastName: Doe
              email: "jane.doe@example.com"
              phone: "+14155550101"
              password: "S3cur3P@ssw0rd!"
              role: customer
      responses:
        "201":
          description: User account created successfully; verification token sent via email/SMS
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/User"
              example:
                id: 64b1f2c3e4b0a1d2e3f40001
                firstName: Jane
                lastName: Doe
                email: "jane.doe@example.com"
                phone: "+14155550101"
                role: customer
                isVerified: false
                status: pendingVerification
                avatarUrl: null
                savedAddresses: []
                notificationPreferences:
                  email: true
                  sms: true
                  push: false
                failedLoginAttempts: 0
                createdAt: "2024-07-15T10:00:00.000Z"
                updatedAt: "2024-07-15T10:00:00.000Z"
        "400":
          description: Validation error – missing or invalid fields
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "409":
          description: Conflict – email or phone already registered
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "422":
          description: Unprocessable entity – password does not meet complexity requirements
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      security: []
  "/auth/verify":
    post:
      tags:
        - auth
      operationId: verifyAccount
      summary: "Verify email or phone with a one-time token"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/VerifyRequest"
            example:
              email: "jane.doe@example.com"
              token: a3f9c21e8b4d67051234abcd
      responses:
        "200":
          description: Account verified; JWT returned for immediate session
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthTokenResponse"
              example:
                accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI2NGIxZjJjM2U0YjBhMWQyZTNmNDAwMDEiLCJyb2xlIjoiY3VzdG9tZXIiLCJpYXQiOjE3MjEwMzIwMDAsImV4cCI6MTcyMTExODQwMH0.signature
                tokenType: Bearer
                expiresIn: 86400
                user:
                  id: 64b1f2c3e4b0a1d2e3f40001
                  firstName: Jane
                  lastName: Doe
                  email: "jane.doe@example.com"
                  role: customer
                  isVerified: true
                  status: active
        "400":
          description: Bad request – token missing or malformed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "404":
          description: User not found for the provided email/phone
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "410":
          description: Token has expired
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "422":
          description: Token is invalid or already used
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      security: []
  "/auth/resend-verification":
    post:
      tags:
        - auth
      operationId: resendVerification
      summary: Resend verification token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ForgotPasswordRequest"
            example:
              email: "jane.doe@example.com"
      responses:
        "200":
          description: Verification token resent successfully (generic message to avoid enumeration)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              example:
                code: VERIFICATION_RESENT
                message: "If an unverified account exists for that address, a new verification token has been sent."
        "400":
          description: Bad request – email/phone missing or invalid format
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "409":
          description: Account is already verified
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "429":
          description: Too many requests – rate limit exceeded for resend attempts
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      security: []
  "/auth/login":
    post:
      tags:
        - auth
      operationId: loginUser
      summary: Authenticate and receive JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/LoginRequest"
            example:
              email: "jane.doe@example.com"
              password: "S3cur3P@ssw0rd!"
      responses:
        "200":
          description: Authentication successful; JWT and user profile returned
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthTokenResponse"
              example:
                accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI2NGIxZjJjM2U0YjBhMWQyZTNmNDAwMDEiLCJyb2xlIjoiY3VzdG9tZXIiLCJpYXQiOjE3MjEwMzIwMDAsImV4cCI6MTcyMTExODQwMH0.signature
                tokenType: Bearer
                expiresIn: 86400
                user:
                  id: 64b1f2c3e4b0a1d2e3f40001
                  firstName: Jane
                  lastName: Doe
                  email: "jane.doe@example.com"
                  role: customer
                  isVerified: true
                  status: active
                  avatarUrl: "https://cdn.example.com/avatars/64b1f2c3.jpg"
        "400":
          description: Bad request – email or password missing
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "401":
          description: Unauthorized – invalid credentials
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "403":
          description: Forbidden – account not verified or suspended
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "423":
          description: Account temporarily locked due to excessive failed login attempts
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "429":
          description: Too many requests – login rate limit exceeded
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      security: []
  "/auth/logout":
    post:
      tags:
        - auth
      operationId: logoutUser
      summary: Invalidate current session token
      description: "Allowed roles: customer, restaurantManager, deliveryAgent, platformAdmin."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example: {}
      responses:
        "204":
          description: Session invalidated successfully; no content returned
          content:
            application/json:
              schema:
                type: object
              example: {}
        "401":
          description: Unauthorized – missing or invalid JWT
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "500":
          description: Internal server error – token denylist unavailable
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      security:
        - bearerAuth: []
  "/auth/forgot-password":
    post:
      tags:
        - auth
      operationId: forgotPassword
      summary: "Request a password-reset link"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ForgotPasswordRequest"
            example:
              email: "jane.doe@example.com"
      responses:
        "200":
          description: Password reset email dispatched (generic response to prevent user enumeration)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              example:
                code: RESET_EMAIL_SENT
                message: "If an account with that email exists, a password reset link has been sent."
        "400":
          description: Bad request – email field missing or invalid format
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "429":
          description: Too many requests – rate limit exceeded for password reset requests
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      security: []
  "/auth/reset-password":
    post:
      tags:
        - auth
      operationId: resetPassword
      summary: "Reset password using a time-limited token"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ResetPasswordRequest"
            example:
              email: "jane.doe@example.com"
              token: d7e2a91f3c084b56789efabc
              newPassword: "N3wS3cur3P@ss!"
      responses:
        "200":
          description: Password reset successful; new JWT returned for immediate session
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthTokenResponse"
              example:
                accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI2NGIxZjJjM2U0YjBhMWQyZTNmNDAwMDEiLCJyb2xlIjoiY3VzdG9tZXIiLCJpYXQiOjE3MjEwMzUwMDAsImV4cCI6MTcyMTEyMTQwMH0.newsignature
                tokenType: Bearer
                expiresIn: 86400
                user:
                  id: 64b1f2c3e4b0a1d2e3f40001
                  firstName: Jane
                  lastName: Doe
                  email: "jane.doe@example.com"
                  role: customer
                  isVerified: true
                  status: active
        "400":
          description: Bad request – required fields missing or new password fails complexity check
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "404":
          description: User not found for the provided email
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "410":
          description: Reset token has expired
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "422":
          description: Token is invalid or already used
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      security: []
  "/users/me":
    get:
      tags:
        - users
      operationId: getMyProfile
      summary: "Get the authenticated user's profile"
      description: "Allowed roles: customer, restaurantManager, deliveryAgent, platformAdmin."
      responses:
        "200":
          description: "Authenticated user's profile returned successfully"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/User"
              example:
                id: 64b1f2c3e4b0a1a2b3c4d5e6
                email: "jane.doe@example.com"
                phone: "+14155552671"
                role: customer
                firstName: Jane
                lastName: Doe
                avatarUrl: "https://cdn.example.com/avatars/jane-doe.jpg"
                isVerified: true
                failedLoginAttempts: 0
                status: active
                savedAddresses:
                  - id: 64b1f2c3e4b0a1a2b3c4d5e7
                    label: Home
                    street: 123 Main St
                    city: San Francisco
                    state: CA
                    postalCode: "94105"
                    country: US
                    isDefault: true
                notificationPreferences:
                  orderUpdates: true
                  promotions: false
                  sms: true
                  push: true
                createdAt: "2024-01-15T10:30:00Z"
                updatedAt: "2024-06-20T08:45:00Z"
        "401":
          description: Missing or invalid authentication token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "403":
          description: Token valid but account is suspended or unverified
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      security:
        - bearerAuth: []
    patch:
      tags:
        - users
      operationId: updateMyProfile
      summary: "Update the authenticated user's profile"
      description: "Allowed roles: customer, restaurantManager, deliveryAgent, platformAdmin."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UpdateProfileRequest"
            example:
              firstName: Jane
              lastName: Smith
              phone: "+14155559876"
              avatarUrl: "https://cdn.example.com/avatars/jane-smith-new.jpg"
              notificationPreferences:
                orderUpdates: true
                promotions: true
                sms: false
                push: true
              pushToken: "fcm-token-abc123xyz"
      responses:
        "200":
          description: Profile updated successfully; returns the updated user object
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/User"
              example:
                id: 64b1f2c3e4b0a1a2b3c4d5e6
                email: "jane.doe@example.com"
                phone: "+14155559876"
                role: customer
                firstName: Jane
                lastName: Smith
                avatarUrl: "https://cdn.example.com/avatars/jane-smith-new.jpg"
                isVerified: true
                failedLoginAttempts: 0
                status: active
                savedAddresses: []
                notificationPreferences:
                  orderUpdates: true
                  promotions: true
                  sms: false
                  push: true
                createdAt: "2024-01-15T10:30:00Z"
                updatedAt: "2024-07-01T12:00:00Z"
        "400":
          description: Validation error – invalid field values in request body
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "401":
          description: Missing or invalid authentication token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "403":
          description: Account is suspended or unverified
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      security:
        - bearerAuth: []
  "/users/me/agent-profile":
    patch:
      tags:
        - users
      operationId: updateAgentProfile
      summary: "Update delivery-agent-specific profile fields"
      description: "Allowed roles: deliveryAgent."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UpdateAgentProfileRequest"
            example:
              vehicleType: bicycle
              vehiclePlate: N/A
              licenseNumber: "DL-2024-00987"
              isAvailable: true
              currentLocation:
                type: string
                coordinates:
                  - -122.4194
                  - 37.7749
      responses:
        "200":
          description: Agent profile updated successfully; returns the full updated user object
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/User"
              example:
                id: 64b1f2c3e4b0a1a2b3c4d5f0
                email: "agent.bob@example.com"
                phone: "+14155550011"
                role: deliveryAgent
                firstName: Bob
                lastName: Carter
                avatarUrl: "https://cdn.example.com/avatars/bob-carter.jpg"
                isVerified: true
                failedLoginAttempts: 0
                status: active
                agentProfile:
                  vehicleType: bicycle
                  vehiclePlate: N/A
                  licenseNumber: "DL-2024-00987"
                  isAvailable: true
                  currentLocation:
                    type: string
                    coordinates:
                      - -122.4194
                      - 37.7749
                createdAt: "2024-02-10T09:00:00Z"
                updatedAt: "2024-07-01T14:30:00Z"
        "400":
          description: Validation error – invalid agent profile field values
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "401":
          description: Missing or invalid authentication token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "403":
          description: Caller is not a delivery agent or account is suspended
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      security:
        - bearerAuth: []
  "/users/me/addresses":
    get:
      tags:
        - users
      operationId: listMyAddresses
      summary: List saved delivery addresses
      description: "Allowed roles: customer."
      responses:
        "200":
          description: Array of saved delivery addresses returned successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Address"
              example:
                - id: 64b1f2c3e4b0a1a2b3c4d5e7
                  label: Home
                  street: 123 Main St
                  city: San Francisco
                  state: CA
                  postalCode: "94105"
                  country: US
                  location:
                    type: string
                    coordinates:
                      - -122.4194
                      - 37.7749
                  isDefault: true
                - id: 64b1f2c3e4b0a1a2b3c4d5e8
                  label: Work
                  street: 456 Market St
                  city: San Francisco
                  state: CA
                  postalCode: "94103"
                  country: US
                  location:
                    type: string
                    coordinates:
                      - -122.3988
                      - 37.7915
                  isDefault: false
        "401":
          description: Missing or invalid authentication token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "403":
          description: Caller is not a customer or account is suspended
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      security:
        - bearerAuth: []
    post:
      tags:
        - users
      operationId: createAddress
      summary: Add a new saved delivery address
      description: "Allowed roles: customer."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/AddressRequest"
            example:
              label: "Mom's House"
              street: 789 Oak Ave
              city: Oakland
              state: CA
              postalCode: "94607"
              country: US
              location:
                type: string
                coordinates:
                  - -122.2711
                  - 37.8044
              isDefault: false
      responses:
        "201":
          description: "New address created and added to the customer's saved addresses"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Address"
              example:
                id: 64b1f2c3e4b0a1a2b3c4d5f1
                label: "Mom's House"
                street: 789 Oak Ave
                city: Oakland
                state: CA
                postalCode: "94607"
                country: US
                location:
                  type: string
                  coordinates:
                    - -122.2711
                    - 37.8044
                isDefault: false
        "400":
          description: Validation error – missing required address fields or invalid coordinates
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "401":
          description: Missing or invalid authentication token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "403":
          description: Caller is not a customer or account is suspended
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      security:
        - bearerAuth: []
  "/users/me/addresses/{addressId}":
    patch:
      tags:
        - users
      operationId: updateAddress
      summary: Edit a saved delivery address
      description: "Allowed roles: customer."
      parameters:
        - name: addressId
          in: path
          required: true
          schema:
            type: string
          description: Unique identifier of the saved address to update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/AddressRequest"
            example:
              label: "Mom's New House"
              street: 789 Oak Ave Apt 2
              city: Oakland
              state: CA
              postalCode: "94607"
              country: US
              location:
                type: string
                coordinates:
                  - -122.2715
                  - 37.8048
              isDefault: true
      responses:
        "200":
          description: Address updated successfully; returns the updated address object
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Address"
              example:
                id: 64b1f2c3e4b0a1a2b3c4d5f1
                label: "Mom's New House"
                street: 789 Oak Ave Apt 2
                city: Oakland
                state: CA
                postalCode: "94607"
                country: US
                location:
                  type: string
                  coordinates:
                    - -122.2715
                    - 37.8048
                isDefault: true
        "400":
          description: Validation error – invalid field values provided
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "401":
          description: Missing or invalid authentication token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "403":
          description: Caller is not a customer or does not own this address
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "404":
          description: Address with the given addressId not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      security:
        - bearerAuth: []
    delete:
      tags:
        - users
      operationId: deleteAddress
      summary: Remove a saved delivery address
      description: "Allowed roles: customer."
      parameters:
        - name: addressId
          in: path
          required: true
          schema:
            type: string
          description: Unique identifier of the saved address to delete
      responses:
        "204":
          description: Address deleted successfully; no content returned
          content:
            application/json:
              schema:
                type: object
              example: null
        "401":
          description: Missing or invalid authentication token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "403":
          description: Caller is not a customer or does not own this address
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "404":
          description: Address with the given addressId not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      security:
        - bearerAuth: []
  "/users":
    get:
      tags:
        - users
      operationId: adminListUsers
      summary: List and search all users (admin)
      description: "Allowed roles: platformAdmin."
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
          description: "Page number for pagination (1-indexed)"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
          description: Number of users to return per page (max 100)
        - name: role
          in: query
          required: false
          schema:
            type: string
          description: Filter users by role
        - name: status
          in: query
          required: false
          schema:
            type: string
          description: Filter users by account status
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: "Full-text search query across firstName, lastName, email, and phone"
        - name: sortBy
          in: query
          required: false
          schema:
            type: string
          description: Field to sort results by
        - name: sortOrder
          in: query
          required: false
          schema:
            type: string
          description: Sort direction
      responses:
        "200":
          description: Paginated list of users returned successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PaginatedEnvelope"
              example:
                data:
