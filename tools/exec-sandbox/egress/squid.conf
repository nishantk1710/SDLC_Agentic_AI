# Egress allowlist proxy for the exec-sandbox.
#
# The sandbox container has NO direct internet route (it sits on an `internal: true` Docker
# network). Its only outbound path is this proxy, via HTTP(S)_PROXY. This proxy permits
# connections ONLY to the package registries below and denies everything else — so
# `install_package` can reach PyPI/npm while nothing else can exfiltrate or fetch.

http_port 3128

# --- Allowlisted registry domains (PyPI + npm) ---
acl allowed_registries dstdomain pypi.org files.pythonhosted.org
acl allowed_registries dstdomain registry.npmjs.org registry.yarnpkg.com

# TLS tunneling (pip/npm use https) is only permitted to :443.
acl SSL_ports port 443
acl CONNECT method CONNECT

# Allow http + CONNECT only to the allowlisted registries; deny all other egress.
http_access allow allowed_registries
http_access deny CONNECT !SSL_ports
http_access deny all
